<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Authentic 3D Kerala Pookalam | Onam Flower Carpet</title>
    <meta name="description" content="An interactive 3D Kerala Pookalam rendered in WebGL. Explore authentic Onam flower carpet design with drag-to-interact effects, camera angles, and dark/light mode.">
    <meta property="og:title" content="Traditional Kerala Pookalam — Interactive 3D">
    <meta property="og:description" content="Authentic Onam flower carpet design in real-time 3D WebGL. Drag to scatter petals, change camera angles, toggle dark/light mode.">
    <meta name="theme-color" content="#111111">

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
    </script>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div id="app"></div>

    <!-- Header Overlay -->
    <div class="ui-header">
        <h1 class="title">🌸 TRADITIONAL KERALA POOKALAM 🌸</h1>
        <p class="subtitle">Based on Authentic Onam Flower Carpet Design • Interactive 3D WebGL</p>
    </div>

    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="theme-btn" title="Toggle Light / Dark Mode" aria-label="Toggle theme">
        <span class="theme-icon theme-icon--dark">🌙</span>
        <span class="theme-icon theme-icon--light">☀️</span>
    </button>

    <!-- Interaction hint: fades after first drag -->
    <div id="drag-hint" class="drag-hint">
        <span>🖱️ Click &amp; drag to scatter petals</span>
    </div>

    <!-- Camera Angles Control Bar -->
    <div class="ui-controls">
        <span class="control-label">Camera Angle:</span>
        <button class="camera-btn active" data-preset="threeD">3D Angle</button>
        <button class="camera-btn" data-preset="top">Top View</button>
        <button class="camera-btn" data-preset="low">Low Angle</button>
        <button class="camera-btn" data-preset="side">Side Angle</button>
        <button class="camera-btn" data-preset="closeup">Close-up</button>
    </div>

    <script type="module" src="./js/main.js"></script>

</body>
</html>
